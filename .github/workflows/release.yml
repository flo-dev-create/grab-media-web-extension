name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier que le tag correspond à la version du manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Le tag ($TAG_VERSION) ne correspond pas à manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Construire les paquets Chrome et Firefox
        run: node scripts/build.mjs

      - name: Signer l'extension Firefox (AMO, distribution non listée)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ]; then
            echo "::warning::Secrets AMO_JWT_ISSUER / AMO_JWT_SECRET absents : le .xpi Firefox n'est pas signé (installable seulement sur Developer Edition/Nightly)."
            exit 0
          fi
          npx --yes web-ext@8 sign --channel=unlisted --source-dir=dist/firefox --artifacts-dir=dist/signed
          cp dist/signed/*.xpi "dist/grab-media-firefox-v$(node -p "require('./src/manifest.json').version").xpi"

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.xpi

      - name: Conserver les paquets (exécution manuelle)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.xpi
