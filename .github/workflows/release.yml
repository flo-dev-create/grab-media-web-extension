name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier que le tag correspond à la version du manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Le tag ($TAG_VERSION) ne correspond pas à manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Construire les paquets Chrome et Firefox
        run: node scripts/build.mjs

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip

      - name: Conserver les paquets (exécution manuelle)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
